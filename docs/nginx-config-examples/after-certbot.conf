# ========================================
# DESPUÉS DE CERTBOT
# ========================================
# Archivo: /etc/nginx/sites-available/stock-in-order.com
# HTTP redirige a HTTPS + Configuración SSL completa

# ==========================================
# BLOQUE HTTP (Puerto 80) - Solo Redirección
# ==========================================
server {
    listen 80;
    listen [::]:80;
    
    server_name stock-in-order.com www.stock-in-order.com;
    
    # ✨ CERTBOT AGREGA ESTA LÍNEA AUTOMÁTICAMENTE
    # Redirige TODO el tráfico HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

# ==========================================
# BLOQUE HTTPS (Puerto 443) - Configuración SSL
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name stock-in-order.com www.stock-in-order.com;
    
    root /var/www/stock-in-order;
    index index.html;
    
    # ========================================
    # 🔒 CERTIFICADOS SSL (Agregados por Certbot)
    # ========================================
    ssl_certificate /etc/letsencrypt/live/stock-in-order.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stock-in-order.com/privkey.pem; # managed by Certbot
    
    # ========================================
    # 🔐 OPCIONES SSL (Agregadas por Certbot)
    # ========================================
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    
    # ========================================
    # Headers de Seguridad Adicionales (Opcionales)
    # ========================================
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Prevenir clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevenir MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (ajustar según necesidades)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;
    
    # ========================================
    # Logs
    # ========================================
    access_log /var/log/nginx/stock-in-order-access.log;
    error_log /var/log/nginx/stock-in-order-error.log;
    
    # ========================================
    # Frontend Estático (React/Vue/Angular)
    # ========================================
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache para assets estáticos
        location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # ========================================
    # API Backend (Go/Node.js/Python)
    # ========================================
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        
        # Headers de proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 🔒 IMPORTANTE: Indica al backend que la conexión original era HTTPS
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # ========================================
    # WebSocket Support (si usas socket.io, etc.)
    # ========================================
    location /ws/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Timeouts largos para WebSockets
        proxy_read_timeout 86400;
    }
    
    # ========================================
    # Let's Encrypt ACME Challenge
    # ========================================
    # Certbot usa esta ruta para validar el dominio
    location ~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/stock-in-order;
    }
    
    # ========================================
    # Denegar acceso a archivos sensibles
    # ========================================
    location ~ /\.(?!well-known).* {
        deny all;
    }
    
    # ========================================
    # Health Check Endpoint (opcional)
    # ========================================
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

# ==========================================
# NOTAS IMPORTANTES
# ==========================================
# 
# 1. Los comentarios "# managed by Certbot" indican que Certbot
#    modificará estas líneas automáticamente al renovar.
#    NO EDITES MANUALMENTE estas líneas.
#
# 2. El archivo /etc/letsencrypt/options-ssl-nginx.conf contiene:
#    - ssl_protocols TLSv1.2 TLSv1.3;
#    - ssl_ciphers seguros
#    - ssl_prefer_server_ciphers off;
#    - ssl_session_cache shared:SSL:50m;
#    - ssl_session_timeout 1d;
#    - ssl_stapling on;
#    - ssl_stapling_verify on;
#
# 3. El archivo /etc/letsencrypt/ssl-dhparams.pem contiene
#    parámetros Diffie-Hellman para Perfect Forward Secrecy.
#
# 4. Los certificados se renuevan automáticamente cada 60 días.
#
# 5. Para verificar la configuración:
#    sudo nginx -t
#
# 6. Para recargar después de cambios:
#    sudo systemctl reload nginx
#
# ==========================================
