# ========================================
# ANTES DE CERTBOT
# ========================================
# Archivo: /etc/nginx/sites-available/stock-in-order.com
# Solo HTTP (Puerto 80)

server {
    listen 80;
    listen [::]:80;
    
    server_name stock-in-order.com www.stock-in-order.com;
    
    root /var/www/stock-in-order;
    index index.html;
    
    # Logs
    access_log /var/log/nginx/stock-in-order-access.log;
    error_log /var/log/nginx/stock-in-order-error.log;
    
    # Frontend estático
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # API Backend
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
